name: Build

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
          
      - name: Restore dependencies
        run: dotnet restore
      - name: Build the solution
        run: dotnet build --no-restore --configuration Release
        
      - name: Zip Breach
        run: zip -r Breach.zip ./src/AxiomVerge.Breach.mm/bin/Release
      - name: Upload Breach artifact
        uses: actions/upload-artifact@v7
        with:
          name: Breach.zip
          path: ./Breach.zip
          
      - name: Zip MiniInstaller
        run: zip -r MiniInstaller.zip ./src/MiniInstaller/bin/Release
      - name: Upload MiniInstaller artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiniInstaller.zip
          path: ./MiniInstaller.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ./Breach.zip
            ./MiniInstaller.zip
          generate_release_notes: false