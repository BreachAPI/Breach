name: Build

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
          
      - name: Restore dependencies
        run: dotnet restore
      - name: Build the solution
        run: dotnet build --no-restore --configuration Release

      - name: Upload Breach artifact
        uses: actions/upload-artifact@v7
        with:
          name: Breach.zip
          path: ./src/AxiomVerge.Breach.mm/bin/Release
      - name: Upload MiniInstallers artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiniInstallers.zip
          path: ./src/AxiomVerge.Breach.mm/bin/Release

      - name: Zip Breach
        run: zip -r Breach.zip ./src/AxiomVerge.Breach.mm/bin/Release
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Zip MiniInstallers
        run: zip -r MiniInstaller-net10.0.zip ./src/MiniInstaller/bin/Release/net10.0/ && zip -r MiniInstaller-net8.0.zip ./src/MiniInstaller/bin/Release/net8.0/ && zip -r MiniInstaller-net481.zip ./src/MiniInstaller/bin/Release/net481/
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ./Breach.zip
            ./MiniInstaller-net10.0.zip
            ./MiniInstaller-net8.0.zip
            ./MiniInstaller-net481.zip
          generate_release_notes: false
