name: Build

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
          
      - name: Restore dependencies
        run: dotnet restore
      - name: Build the solution
        run: dotnet build --no-restore --configuration Release
        
      - name: Upload Breach artifact
        uses: actions/upload-artifact@v7
        with:
          name: Breach.zip
          path: ./src/AxiomVerge.Breach.mm/bin/Release

      - name: Dump MiniInstaller outputs
        uses: actions/upload-artifact@v7
        with:
          name: MiniInstaller-Release
          path: ./src/MiniInstaller/bin/Release

  package-miniinstaller:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        target: [net481, net8.0, net10.0]
    steps:
      - name: Download MiniInstaller outputs
        uses: actions/download-artifact@v7
        with:
          name: MiniInstaller-Release
          path: ./MiniInstaller-Release
      - name: Upload MiniInstaller artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiniInstaller-${{ matrix.target }}.zip
          path: ./MiniInstaller-Release/${{ matrix.target }}

  release:
    runs-on: ubuntu-latest
    needs: [build, package-miniinstaller]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download zipped artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*.zip"
          path: ./artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/Breach.zip
            ./artifacts/MiniInstaller-net481.zip
            ./artifacts/MiniInstaller-net8.0.zip
            ./artifacts/MiniInstaller-net10.0.zip
          generate_release_notes: false